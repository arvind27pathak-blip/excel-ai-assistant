[project]
name = "excel-ai-assistant"
version = "1.0.0b1"
description = "A desktop application for reviewing and applying AI transformations to Excel and CSV data."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = [
    "numpy>=2.2.5",
    "openai>=1.76.2",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "python-dotenv>=1.1.0",
    "requests>=2.32.3",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.scripts]
excel-ai-assistant = "app.__main__:main"

[tool.setuptools.packages.find]
include = ["app", "app.*"]
