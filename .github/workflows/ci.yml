name: Desktop checks
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      distribution-artifact:
        description: Optional prebuilt release distributions to test
        type: string
        default: ''

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Linux GUI prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb xauth
      - name: Build distribution
        if: inputs.distribution-artifact == ''
        shell: bash
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
      - uses: actions/download-artifact@v4
        if: inputs.distribution-artifact != ''
        with:
          name: ${{ inputs.distribution-artifact }}
          path: dist
      - name: Install distribution
        shell: bash
        run: |
          python -m pip install dist/excel_ai_assistant-*.whl -r requirements-test.txt
          python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q app main.py tests
      - name: Test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tests = Join-Path $env:GITHUB_WORKSPACE 'tests'
          Set-Location $env:RUNNER_TEMP
          python -I -m app --check-install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          excel-ai-assistant --check-install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -m unittest discover -s $tests -v
      - name: Test with virtual display on Linux
        if: runner.os == 'Linux'
        run: |
          cd "$RUNNER_TEMP"
          xvfb-run -a python -I -m app --check-install
          xvfb-run -a excel-ai-assistant --check-install
          xvfb-run -a python -I -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install audit tool
        run: python -m pip install pip-audit
      - name: Audit runtime requirements and transitive dependencies
        run: python -m pip_audit --strict -r requirements.txt --format json --output dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: ignore
